# ==========================================
# PRODUCTION DOCKER COMPOSE (EC2)
# ==========================================
# 生产环境: RDS PostgreSQL + AWS ElastiCache Redis
# 只运行 backend 容器

services:
  backend:
    image: ${DOCKER_IMAGE:-fitnessdev/fitness-backend:latest}
    container_name: fitness-app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
