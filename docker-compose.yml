services:
  redis:
    image: redis:7-alpine
    container_name: fitness-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    # ⚠️ 注意：请把 eliaaazzz 换成你自己的 Docker Hub 用户名
    image: docker.io/eliaaazzz/fitness-backend:latest
    container_name: fitness-backend
    restart: unless-stopped
    depends_on:
      - redis
    # 读取服务器上的 .env 文件
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  redis_data: