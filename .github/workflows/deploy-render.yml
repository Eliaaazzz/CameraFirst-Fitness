name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/backend/**'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch:

concurrency:
  group: backend-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # BUILD & TEST JOB
  # ========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Run tests
        working-directory: backend
        run: |
          chmod +x gradlew
          echo "Running unit tests..."
          ./gradlew test --no-daemon -PexcludeSlowTests
          echo "Tests passed"

      - name: Build JAR
        working-directory: backend
        run: |
          echo "Building JAR..."
          ./gradlew bootJar --no-daemon
          ls -lh build/libs/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results
          retention-days: 30

  # ========================================
  # TRIGGER RENDER DEPLOY
  # ========================================
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set"
            echo "Please set up the deploy hook in Render dashboard"
            exit 1
          fi

          echo "Triggering Render deployment..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")

          if [ "$response" = "200" ] || [ "$response" = "201" ]; then
            echo "Render deployment triggered successfully"
          else
            echo "Failed to trigger Render deployment. HTTP status: $response"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "Render Deployment Triggered"
          echo "========================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo ""
          echo "Note: Check Render dashboard for deployment status"
          echo "Render will build and deploy the Docker image automatically"
          echo ""
          echo "Free tier cold start: ~30-60 seconds after inactivity"
