name: Deploy Backend to Render

on:
  push:
    branches:
      - main
      - CF-35-fix-refine-uiux-to-be-saa-s
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_REPO: fitness-backend

concurrency:
  group: backend-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # BUILD & TEST JOB
  # ========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Run tests
        working-directory: backend
        run: |
          chmod +x gradlew
          echo "Running unit tests..."
          ./gradlew test --no-daemon -PexcludeSlowTests
          echo "Tests passed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results
          retention-days: 30

  # ========================================
  # BUILD & PUSH DOCKER IMAGE
  # ========================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      docker-enabled: ${{ steps.docker_mode.outputs.enabled }}
      image-name: ${{ steps.docker_mode.outputs.image }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker publish mode
        id: docker_mode
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          enabled=false

          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            enabled=true
            echo "✅ Docker Hub credentials found. Will build & push image."
            echo "image=${{ env.REGISTRY }}/${DOCKERHUB_USERNAME}/${{ env.IMAGE_REPO }}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub secrets not set. Skipping Docker build/push."
            echo "::notice::If your Render service builds from this repo (Dockerfile), deployment can still work without Docker Hub."
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.docker_mode.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.docker_mode.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker_mode.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push Docker image
        if: steps.docker_mode.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build summary
        if: steps.docker_mode.outputs.enabled == 'true'
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Image tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

  # ========================================
  # TRIGGER RENDER DEPLOY
  # ========================================
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK_URL_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}
        run: |
          set -euo pipefail

          # main -> production hook (expects Render to pull :latest)
          # non-main -> staging hook (expects Render to pull :<branch>)
          hook_url="${RENDER_DEPLOY_HOOK_URL_PROD:-}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            hook_url="${RENDER_DEPLOY_HOOK_URL_STAGING:-}"
          fi

          if [ -z "${hook_url:-}" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "RENDER_DEPLOY_HOOK_URL_STAGING secret is not set; skipping deploy for ${GITHUB_REF}."
              exit 0
            fi
            echo "RENDER_DEPLOY_HOOK_URL secret is not set"
            echo "Please set up the deploy hook in Render dashboard"
            exit 1
          fi

          echo "Triggering Render deployment..."
          response=$(curl -sS -L -o /dev/null -w "%{http_code}" -X POST "$hook_url")

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Render deployment triggered successfully (HTTP $response)"
          else
            echo "Failed to trigger Render deployment. HTTP status: $response"
            exit 1
          fi

      - name: Deployment summary
        env:
          DOCKER_ENABLED: ${{ needs.build-docker.outputs.docker-enabled }}
          IMAGE_NAME: ${{ needs.build-docker.outputs.image-name }}
          IMAGE_TAGS: ${{ needs.build-docker.outputs.image-tags }}
        run: |
          echo "========================================"
          echo "Render Deployment Triggered"
          echo "========================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo ""
          if [ "${DOCKER_ENABLED}" = "true" ] && [ -n "${IMAGE_NAME:-}" ]; then
            echo "Docker image published:"
            echo "  ${IMAGE_NAME}"
            echo "Tags:"
            echo "${IMAGE_TAGS:-}" | tr ',' '\n' | sed 's/^/  - /'
          else
            echo "Docker image: skipped (no Docker Hub secrets)"
            echo "Render must be configured to build from repo/Dockerfile for code changes to deploy."
          fi
