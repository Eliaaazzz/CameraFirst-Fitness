name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: aurafitness
  REGION: australia-southeast2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle (with build caching)
        uses: gradle/actions/setup-gradle@v4

      # GitHub-hosted runners have Docker, so Testcontainers integration/repository tests run for
      # real here (the schema, JPA mappings and pgvector queries are exercised) — no -PskipContainerTests.
      - name: Run full test suite + coverage gate
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/$PROJECT_ID/aurafitness-backend:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/aurafitness-backend:latest \
            -f backend/Dockerfile \
            backend

      - name: Push Docker image
        run: |
          docker push gcr.io/$PROJECT_ID/aurafitness-backend:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/aurafitness-backend:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/aurafitness-backend:${{ github.sha }}
