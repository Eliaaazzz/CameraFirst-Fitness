name: Build, Test & Deploy Backend (Improved)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/backend/**'
      - '.github/workflows/build-test-deploy-backend.yml'
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fitness-backend
  REGISTRY: docker.io

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # BUILD & TEST JOB
  # ========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Run tests
        working-directory: backend
        run: |
          chmod +x gradlew
          echo "🧪 Running unit tests (excluding slow integration tests)..."
          ./gradlew test --no-daemon -PexcludeSlowTests
          echo "✅ Tests passed"

      - name: Run linting checks
        working-directory: backend
        run: |
          echo "🔍 Running code quality checks..."
          ./gradlew checkstyleMain --no-daemon || echo "⚠️ Checkstyle warnings found (non-blocking)"
          echo "✅ Linting complete"

      - name: Generate test report
        if: always()
        working-directory: backend
        run: |
          echo "📊 Test Report:"
          if [ -d "build/test-results" ]; then
            find build/test-results -name "*.xml" -exec basename {} \;
          else
            echo "⚠️ Test results directory not found"
          fi
          ./gradlew jacocoTestReport --no-daemon || true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: backend/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          fail_ci_if_error: false

      - name: Build JAR
        working-directory: backend
        run: |
          echo "🏗️ Building JAR..."
          ./gradlew bootJar --no-daemon
          ls -lh build/libs/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results
          retention-days: 30

  # ========================================
  # BUILD DOCKER IMAGE
  # ========================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    
    permissions:
      contents: read
      security-events: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Image build summary
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
          echo "Image digest: ${{ steps.build.outputs.digest }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # ========================================
  # DEPLOY TO EC2
  # ========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          echo "🔐 Setting up SSH..."
          
          if [ -z "${EC2_HOST:-}" ]; then
            echo "❌ EC2_HOST secret is missing" >&2
            exit 1
          fi
          if [ -z "${EC2_SSH_KEY:-}" ] && [ -z "${EC2_SSH_KEY_B64:-}" ]; then
            echo "❌ EC2_SSH_KEY (or EC2_SSH_KEY_B64) secret is missing" >&2
            exit 1
          fi
          if [ -z "${EC2_USER:-}" ]; then
            echo "❌ EC2_USER secret is missing" >&2
            exit 1
          fi
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          if [ -n "${EC2_SSH_KEY_B64:-}" ]; then
            if ! printf '%s' "$EC2_SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa 2>/dev/null; then
              echo "❌ EC2_SSH_KEY_B64 failed to decode" >&2
              exit 1
            fi
          else
            printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          fi
          
          chmod 600 ~/.ssh/id_rsa
          
          if ! grep -q "BEGIN [A-Z ]*PRIVATE KEY" ~/.ssh/id_rsa; then
            echo "❌ SSH key appears to be malformed" >&2
            exit 1
          fi
          
          if ! ssh-keygen -yf ~/.ssh/id_rsa >/dev/null 2>&1; then
            echo "❌ SSH key failed to parse" >&2
            exit 1
          fi
          
          if ! ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "⚠️ ssh-keyscan failed; using insecure mode"
            printf "Host *\n  StrictHostKeyChecking no\n" >> ~/.ssh/config
          fi
          
          echo "✅ SSH configured"

      - name: Create deployment script
        env:
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:latest
        run: |
          mkdir -p scripts
          cat > scripts/deploy-backend.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          DOCKER_IMAGE="${1:-}"
          [ -z "$DOCKER_IMAGE" ] && { echo "Usage: $0 <docker-image>"; exit 1; }

          APP_DIR="/opt/fitness-app"

          echo "🚀 Starting backend deployment..."
          echo "📦 Image: $DOCKER_IMAGE"

          # Pull latest image
          echo "📥 Pulling Docker image..."
          docker pull "$DOCKER_IMAGE" || {
            echo "❌ Failed to pull Docker image"
            exit 1
          }

          # Navigate to app directory
          cd "$APP_DIR" || { echo "❌ App directory not found: $APP_DIR"; exit 1; }

          # Check required files
          if [ ! -f ".env.prod" ]; then
            echo "❌ .env.prod not found in $APP_DIR"
            exit 1
          fi
          if [ ! -f "docker-compose.prod.yml" ]; then
            echo "❌ docker-compose.prod.yml not found in $APP_DIR"
            exit 1
          fi

          # Stop and remove old container
          echo "🛑 Stopping old container..."
          docker-compose -f docker-compose.prod.yml down --remove-orphans || true

          # Start new container
          echo "🚀 Starting new container..."
          DOCKER_IMAGE="$DOCKER_IMAGE" docker-compose -f docker-compose.prod.yml up -d

          # Wait for health check
          echo "⏳ Waiting for service to be healthy..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Attempt $attempt/$max_attempts..."
            sleep 2
          done

          echo "❌ Backend failed health check"
          docker-compose -f docker-compose.prod.yml logs app
          exit 1
          EOF

          chmod +x scripts/deploy-backend.sh

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:latest
        run: |
          set -euo pipefail
          echo "📤 Uploading deployment script..."
          scp -i ~/.ssh/id_rsa \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            scripts/deploy-backend.sh \
            "$EC2_USER@$EC2_HOST":/tmp/
          
          echo "🚀 Executing deployment..."
          ssh -i ~/.ssh/id_rsa \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$EC2_USER@$EC2_HOST" \
            "bash /tmp/deploy-backend.sh '$DOCKER_IMAGE'"

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          echo "🔍 Verifying deployment..."
          
          # Check HTTP health
          max_attempts=10
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -sf "http://$EC2_HOST:8080/actuator/health" > /dev/null 2>&1; then
              echo "✅ Service is healthy"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Attempt $attempt/$max_attempts..."
            sleep 5
          done
          
          echo "❌ Service health check failed"
          exit 1

      - name: Create deployment notice
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.payload.workflow_run?.conclusion || 'success';
            const message = `
            🚀 Backend Deployment Report
            
            **Status**: ${status.toUpperCase()}
            **Branch**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            **Actor**: ${{ github.actor }}
            
            [View Workflow](${context.payload.workflow_run?.html_url || '#'})
            `;
            
            if (context.payload.inputs?.notify_slack) {
              console.log(message);
            }

  # ========================================
  # ROLLBACK JOB (Manual)
  # ========================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: deploy
    
    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          if [ -n "${EC2_SSH_KEY_B64:-}" ]; then
            printf '%s' "$EC2_SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa 2>/dev/null || true
          else
            printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          fi
          
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rollback to previous version
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          echo "⚠️ ROLLING BACK DEPLOYMENT"

          ssh -i ~/.ssh/id_rsa \
            "$EC2_USER@$EC2_HOST" \
            "cd /opt/fitness-app && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d"

          echo "✅ Rollback complete"

      - name: Notify rollback
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const message = '🔄 Deployment was rolled back due to health check failure';
            
            // Only post comment if this is triggered from a PR or issue
            if (context.issue && context.issue.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            } else {
              // For push events, just log the message
              console.log(message);
              console.log(`Rollback triggered for commit: ${context.sha}`);
            }
