name: Build, Test & Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/README.md'
      - '.github/workflows/build-test-deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # LINT, TYPE CHECK & TEST
  # ========================================
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          npm run lint --workspace=frontend 2>&1 || {
            echo "⚠️ ESLint found issues (non-blocking for now)"
            exit 0
          }

      - name: Run TypeScript type check
        run: |
          echo "🔍 Running TypeScript type check..."
          npm run type-check --workspace=frontend || {
            echo "❌ TypeScript errors found"
            exit 1
          }

      - name: Run Jest tests
        run: |
          echo "🧪 Running unit tests..."
          npm run test --workspace=frontend -- --coverage --watchAll=false --passWithNoTests || {
            echo "⚠️ Some tests failed (non-blocking for PR)"
            [ "${{ github.event_name }}" = "push" ] && exit 1
            exit 0
          }

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ========================================
  # BUILD FRONTEND BUNDLE
  # ========================================
  build:
    name: Build Frontend Bundle
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Build frontend
        env:
          NODE_ENV: production
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          echo "🏗️ Building frontend..."
          npm run build --workspace=frontend
          echo "✅ Build completed"
          ls -la frontend/dist/

      - name: Generate build info
        working-directory: frontend
        run: |
          cat > dist/.build-info.json << EOF
          {
            "buildTime": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "gitCommit": "${{ github.sha }}",
            "gitBranch": "${{ github.ref_name }}",
            "buildNumber": "${{ github.run_number }}"
          }
          EOF
          cat dist/.build-info.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/dist
          retention-days: 7

  # ========================================
  # DEPLOY TO S3
  # ========================================
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          echo "🚀 Deploying to S3..."

          # Sync all assets with long cache
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html"

          # Upload index.html with no-cache for SPA routing
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

          echo "✅ S3 deployment completed"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "🔄 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
          echo "✅ CloudFront invalidation created"

      - name: Deployment summary
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Bucket: ${S3_BUCKET}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Build: ${{ github.run_number }}"
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
