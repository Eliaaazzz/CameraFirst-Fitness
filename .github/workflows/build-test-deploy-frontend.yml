steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # 关键点 1：指向根目录的 lock 文件，确保缓存生效
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      # 关键点 2：使用 workspace 参数构建，并解决路径问题
      - name: Build frontend
        env:
          NODE_ENV: production
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          echo "🏗️ Building frontend..."
          # 使用 workspace 参数确保正确调用前端构建
          npm run build --workspace=frontend
          
          echo "📂 Checking build output..."
          ls -la frontend/dist/
          
          # 关键点 3：把构建好的文件搬运到根目录 dist，
          # 这样就不需要改下面 AWS S3 的上传路径了
          echo "🚚 Moving artifacts to root dist folder..."
          rm -rf dist
          cp -r frontend/dist dist