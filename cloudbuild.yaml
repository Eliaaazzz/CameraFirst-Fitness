steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/aurafitness-backend:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/aurafitness-backend:latest"
      - "-f"
      - "backend/Dockerfile"
      - "backend"

  # Push images to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/aurafitness-backend:$SHORT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/aurafitness-backend:latest"]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "aurafitness"
      - "--image"
      - "gcr.io/$PROJECT_ID/aurafitness-backend:$SHORT_SHA"
      - "--region"
      - "australia-southeast2"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

images:
  - "gcr.io/$PROJECT_ID/aurafitness-backend:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/aurafitness-backend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
