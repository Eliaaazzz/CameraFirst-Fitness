spring:
  application:
    name: fitness-app
  profiles:
    default: dev
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  data:
    redis:
      repositories:
        enabled: false

usda:
  api:
    key: ${USDA_API_KEY:}
    base-url: https://api.nal.usda.gov/fdc/v1

# Cloudflare R2 Storage
r2:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_ACCESS_KEY}
  bucket: ${R2_BUCKET_NAME:aurafit}
  public-url: ${R2_PUBLIC_URL:https://media.aurafitness.com}

app:
  api-key: ${API_KEY:${APP_API_KEY:fitness-secret-key-123}}  # API Key for request authentication (X-API-Key header)
  cookie:
    # For web (cookie-based auth). In cross-site deployments (frontend on a different
    # domain/subdomain than the API), set same-site to "None" and provide a domain.
    # These can be overridden by environment variables:
    #   APP_COOKIE_SECURE=true|false
    #   APP_COOKIE_SAME_SITE=None|Lax|Strict
    #   APP_COOKIE_DOMAIN=.aurafitness.org
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:Strict}
    domain: ${APP_COOKIE_DOMAIN:}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    ingestion-enabled: ${YOUTUBE_INGESTION_ENABLED:true}
    quota:
      warnings-enabled: true
  spoonacular:
    api-key: ${SPOONACULAR_API_KEY:}
  openai:
    # OpenAI is OPTIONAL - app works without it
    # If not provided, AI features (pose analysis, recipe generation, nutrition insights) are disabled
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o
    meal-model: gpt-4o
    timeout-seconds: 60
    cost-per-thousand-tokens: 10.0
    log-usage: true
  anthropic:
    # Anthropic Claude API for food recognition (DEPRECATED - use Gemini instead)
    api-key: ${ANTHROPIC_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-pro-preview-06-05}
    enabled: ${GEMINI_ENABLED:true}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  apple:
    client-id: ${APPLE_CLIENT_ID:}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-needs-to-be-at-least-256-bits-long}
    expiration-days: ${JWT_EXPIRATION_DAYS:30}
  meal-plan:
    cache-ttl-hours: 24
  recipe-generation:
    cache-ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true

logging:
  level:
    com.fitnessapp.backend: INFO
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    restart:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database-1.cdq2m4iswpu8.ap-southeast-2.rds.amazonaws.com:5432/fitness_mvp}
    username: ${SPRING_DATASOURCE_USERNAME:fitnessuser}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Validate schema matches entities (Flyway manages migrations)
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  cache:
    type: redis
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true

management:
  endpoint:
    health:
      probes:
        enabled: true

