---
# ========================================
# PROD PROFILE (Supabase on Render, no Redis)
# ========================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Supabase connection via Spring standard properties
    # SPRING_DATASOURCE_URL must start with jdbc:postgresql://
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5  # Supabase free tier has connection limits
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  cache:
    type: none  # Disable caching (no Redis)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate  # Let Flyway manage schema, validate on startup
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true  # Ensure migration checksum consistency
    repair-on-migrate: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}  # Render uses PORT env var
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false  # Disable Redis health check

logging:
  level:
    com.fitnessapp.backend: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Environment Variables for prod profile (Render deployment):
# SPRING_PROFILES_ACTIVE=prod
# JAVA_TOOL_OPTIONS=-Xmx384m -XX:+UseContainerSupport
# SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
# SPRING_DATASOURCE_USERNAME=postgres.<project-ref>
# SPRING_DATASOURCE_PASSWORD=<your-password>