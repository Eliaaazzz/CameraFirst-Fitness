services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitness_mvp
      POSTGRES_USER: fitnessuser
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      # Bind Mount: 数据存放在项目目录下，删除 Docker 也不会丢失数据
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnessuser -d fitness_mvp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitness-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Bind Mount: Redis 数据也存放在项目目录下
      - ./redis_data:/data

  backend:
    # Use local image for development
    image: fitness-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fitness-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../.env
    ports:
      - "8080:8080"

# 不再使用 named volumes，改用 bind mounts
# volumes:
#   postgres_data:  # 删除 - 数据会藏在 Docker 深处
#   redis_data:     # 删除 - 同上
